plugins {
    id 'java'
    id 'com.gradleup.shadow' version '8.3.9'
}

repositories {
    mavenCentral()
    maven {
        name = "hytale-release"
        url = uri("https://maven.hytale.com/release")
    }
    maven {
        name = "hytale-pre-release"
        url = uri("https://maven.hytale.com/pre-release")
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

dependencies {
    compileOnly("com.hypixel.hytale:Server:0.5.7")
    compileOnly("org.projectlombok:lombok:1.18.42")
    annotationProcessor("org.projectlombok:lombok:1.18.42")
    implementation("org.yaml:snakeyaml:2.2")
}

ext {
    def home = System.getProperty("user.home")
    def base = file("${home}/AppData/Roaming/Hytale/UserData/Mods")

    hytaleSaveModsDir = base.exists() ? base : null
}

tasks.named('jar') {
    archiveBaseName.set(project.name)
    archiveVersion.set("")
    archiveClassifier.set("")
}

tasks.named('shadowJar') {
    archiveBaseName.set(project.name)
    archiveVersion.set("")
    archiveClassifier.set("")
    destinationDirectory.set(layout.buildDirectory.dir("generated/libs"))
}

tasks.register('buildInMods', Copy) {
    dependsOn tasks.named('shadowJar')
    dependsOn tasks.named('test')

    onlyIf {
        hytaleSaveModsDir != null
    }

    from tasks.named('shadowJar').get().archiveFile
    into hytaleSaveModsDir
}